# AeroPulse · réglages Supabase des fonctions serveur.
# Les tâches planifiées s'authentifient avec le secret CRON_SECRET (en-tête x-cron-secret),
# pas avec un jeton utilisateur ; l'import exige un utilisateur connecté.

[functions.ingest-metar]
verify_jwt = false

[functions.sync-flights]
verify_jwt = false

[functions.import-flights]
# Le jeton utilisateur est vérifié dans le code (sb.auth.getUser), compatible avec les nouvelles clés.
verify_jwt = false

[functions.seed-airports]
verify_jwt = false

[functions.guest-access]
# Jeton utilisateur vérifié dans le code ; le nettoyage planifié présente le secret x-cron-secret.
verify_jwt = false
